<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aventura de Monstruos — Exploración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" width="800" height="600"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="stat">Nivel: <strong id="level">1</strong></div>
        <div class="stat">Puntos: <strong id="score">0</strong></div>
        <div class="stat">Gemas: <strong id="gems">0</strong></div>
      </div>
      <div class="health">
        <span>Vida</span>
        <div class="health-bar"><div id="healthFill"></div></div>
      </div>
      <div class="hud-right">
        <button id="soundBtn" class="btn">🔊</button>
      </div>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h1 id="overlayTitle">Aventura de Monstruos</h1>
        <p id="overlayText">Explora la mazmorra: recolecta gemas, evita o combate monstruos y llega a la salida (escalera).</p>
        <button id="startBtn" class="btn btn-primary">Entrar</button>
        <div class="tips">
          <span>WASD / Flechas = mover</span>
          <span>Espacio = atacar</span>
          <span>P = pausa</span>
        </div>
      </div>
    </div>

    <div id="gameOver" class="overlay" hidden>
      <div class="overlay-card">
        <h1 id="endTitle">Fin</h1>
        <p>Puntuación final: <strong id="finalScore">0</strong></p>
        <p>Nivel alcanzado: <strong id="finalLevel">1</strong></p>
        <button id="retryBtn" class="btn btn-primary">Reintentar</button>
      </div>
    </div>
  </div>

  <p class="footer">Aventura de Monstruos · HTML5 Canvas</p>
  <script src="game.js"></script>
</body>
</html>
